name: Publish to MCP Registry

# Publishes server.json to the official Model Context Protocol registry
# (https://registry.modelcontextprotocol.io).
#
# Authentication is GitHub OIDC: the runner mints a short-lived token that
# proves this workflow is running inside GarphenGate/moltline-mcp, which is
# what entitles it to the io.github.garphengate/* namespace. No secret is
# stored, read, or printed anywhere in this workflow.
#
# Registry versions are immutable, so this runs only when it is asked to:
#   - push a tag like v1.1.0, or
#   - press "Run workflow" on the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token; this is the only privilege needed
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "publishing version $VERSION"

      - name: Show what will be published
        run: cat server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
