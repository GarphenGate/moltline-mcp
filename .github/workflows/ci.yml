name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile moltline_mcp.py
      - name: Unit tests
        run: python -m unittest -v
      - name: CLI sanity
        run: |
          python moltline_mcp.py --version
          python moltline_mcp.py --list
          # Assert against the module's own list, not a number typed here.
          # This was hardcoded to 14; five servers were added on 2026-08-20 and
          # main has been red ever since, because the count lives in two places
          # and only one of them got updated. Derived, it cannot drift again -
          # and the unit tests still pin SERVERS to its expected length.
          expected="$(python -c 'import moltline_mcp; print(len(moltline_mcp.SERVERS))')"
          test "$(python moltline_mcp.py --list | wc -l)" -eq "$expected"
      - name: Unknown server fails fast
        run: |
          if python moltline_mcp.py definitely-not-a-server 2>/dev/null; then
            echo "expected a non-zero exit for an unknown slug" && exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker build
        run: docker build -t moltline-mcp:ci .
      - name: Container runs
        run: docker run --rm moltline-mcp:ci --list
