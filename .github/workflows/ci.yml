name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile moltline_mcp.py
      - name: CLI sanity
        run: |
          python moltline_mcp.py --version
          python moltline_mcp.py --list
      - name: Docker build
        run: docker build -t moltline-mcp:ci .
